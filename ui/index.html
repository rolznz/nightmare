<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightmare</title>
<style>
:root{--bg:#0b0e14;--panel:#131824;--text:#d7dde8;--dim:#7d8697;--acc:#7c5cff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--border:#242c3d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.title{font-weight:700;color:var(--acc)}
#bar{display:flex;gap:14px;color:var(--dim);font-size:13px;margin-left:auto;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.dot.busy{background:var(--warn)}
.dot.off{background:var(--err)}
button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--dim)}
main{flex:1;overflow-y:auto;padding:18px 14px}
.wrap{max-width:960px;margin:0 auto}
.msg{margin:0 0 14px;white-space:pre-wrap;word-wrap:break-word}
.msg .who{color:var(--dim);font-size:12px;display:block;margin-bottom:2px}
.msg.user .body{color:#9ecbff}
.msg.error .body{color:var(--err)}
.msg.note .body{color:var(--dim);font-size:13px}
.tool,.tool-result{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin:8px 0;font-size:13px}
.tool summary,.tool-result summary{cursor:pointer;color:var(--dim)}
.tool pre,.tool-result pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-all;color:#c9d1d9;max-height:260px;overflow:auto}
footer{display:flex;gap:8px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--border)}
footer .inner{max-width:960px;width:100%;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit;max-height:160px}
#send{align-self:flex-end;color:var(--acc)}
</style>
</head>
<body>
<header>
  <span class="title">nightmare</span>
  <span id="bar">
    <span><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
    <span id="model"></span>
    <span id="queued"></span>
  </span>
  <button id="bNew">new session</button>
  <button id="bCompact">compact</button>
</header>
<main id="chat"><div class="wrap" id="wrap"></div></main>
<footer><div class="inner">
  <textarea id="in" placeholder="message the agent…  (Enter = send, Shift+Enter = newline)" rows="2"></textarea>
  <button id="send">send</button>
</div></footer>
<script>
const $=id=>document.getElementById(id);
const chatEl=$('chat'), wrapEl=$('wrap'), inEl=$('in');
let token=new URLSearchParams(location.search).get('token')||sessionStorage.getItem('nm-token')||'';
async function api(p,opts={}){
  opts.headers=Object.assign({'content-type':'application/json'},opts.headers,token?{authorization:'Bearer '+token}:{});
  const r=await fetch(p,opts);
  if(r.status===401){
    const t=prompt('This server requires a token:');
    if(t){token=t;sessionStorage.setItem('nm-token',t);}
    location.reload();
    throw new Error('unauthorized');
  }
  try{return await r.json();}catch{return {};}
}
function addMsg(cls,label){
  const d=document.createElement('div');d.className='msg '+cls;
  if(label){const s=document.createElement('span');s.className='who';s.textContent=label;d.appendChild(s);}
  const b=document.createElement('div');b.className='body';d.appendChild(b);
  wrapEl.appendChild(d);return b;
}
function nearBottom(){return chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight<140;}
function scrollBottom(){if(nearBottom())chatEl.scrollTop=chatEl.scrollHeight;}
function renderAgent(body,text){
  const parts=text.split(/(```(?:bash|sh|shell)[^\S]*\r?\n[\s\S]*?```)/g);
  body.innerHTML='';
  for(const p of parts){
    if(p.startsWith('```')){
      const cmd=p.replace(/^```(?:bash|sh|shell)[^\S]*\r?\n/,'').replace(/```\s*$/,'');
      const det=document.createElement('details');det.className='tool';
      const sum=document.createElement('summary');sum.textContent='⚙ '+cmd.split('\n')[0];
      const pre=document.createElement('pre');pre.textContent=cmd;
      det.appendChild(sum);det.appendChild(pre);body.appendChild(det);
    }else if(p)body.appendChild(document.createTextNode(p));
  }
  scrollBottom();
}
function toolCard(e){
  const det=document.createElement('details');det.className='tool-result';
  const sum=document.createElement('summary');
  sum.textContent='⚙ '+e.cmd.split('\n')[0]+' · exit '+(e.code||0)+' · '+(e.ms||0)+'ms'+(e.code===0?'':' ⚠');
  const pre=document.createElement('pre');pre.textContent=(e.out&&e.out.length)?e.out:'(no output)';
  det.appendChild(sum);det.appendChild(pre);wrapEl.appendChild(det);scrollBottom();
}
let cur=null;
function onEvt(e){
  switch(e.type){
    case 'hello':refreshSession();break;
    case 'turn':cur=addMsg('agent','agent · turn '+e.i);cur._text='';break;
    case 'delta':
      if(!cur){cur=addMsg('agent','agent');cur._text='';}
      cur._text+=e.text;renderAgent(cur,cur._text);break;
    case 'tool_end':toolCard(e);break;
    case 'error':addMsg('error','error').textContent=e.text;scrollBottom();break;
    case 'info':addMsg('note','').textContent=e.text;scrollBottom();break;
    case 'queued':$('queued').textContent=e.count?'queue: '+e.count:'';break;
    case 'state':
      $('dot').classList.toggle('busy',!!e.busy);
      $('status').textContent=e.busy?'working':'ready';
      $('dot').classList.remove('off');
      $('queued').textContent=e.queued!=null&&e.queued?'queue: '+e.queued:'';
      break;
  }
}
async function refreshSession(){
  const s=await api('/session');
  if(!s.id||!s.messages.length||wrapEl.children.length>0)return;
  for(const m of s.messages){
    if(m.role==='user'){
      if(String(m.content).startsWith('OUTPUT:')||String(m.content).startsWith('CONTEXT BRIEF'))continue;
      addMsg('user','you').textContent=m.content;
    }else{
      const b=addMsg('agent','agent');
      renderAgent(b,m.content);
    }
  }
  scrollBottom();
}
async function health(){
  try{
    const h=await fetch('/health').then(r=>r.json());
    $('model').textContent=h.model||'';
    if(!document.getElementById('status').classList.contains('busy-offline')){
      $('status').textContent=h.busy?'working':'ready';
    }
    $('dot').classList.remove('off');
  }catch{
    $('status').textContent='offline';
    $('dot').classList.add('off');
  }
}
function send(){
  const t=inEl.value.trim();if(!t)return;
  api('/chat',{method:'POST',body:JSON.stringify({text:t})});
  inEl.value='';inEl.style.height='auto';
}
$('send').onclick=send;
inEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inEl.addEventListener('input',()=>{inEl.style.height='auto';inEl.style.height=Math.min(inEl.scrollHeight,160)+'px';});
$('bNew').onclick=()=>api('/new',{method:'POST'});
$('bCompact').onclick=()=>api('/compact',{method:'POST'});
const es=new EventSource('/events'+(token?'?token='+encodeURIComponent(token):''));
es.onmessage=e=>{try{onEvt(JSON.parse(e.data));}catch{}};
setInterval(health,5000);health();
</script>
</body>
</html>
